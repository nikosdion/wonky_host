services:
  php-container:
    build:
      context: .
      dockerfile: Dockerfile-php
    networks:
      - app-network
    volumes:
      - ./web-root:/var/www/html

  mysql-container:
    image: mysql:8.0
    command:
      - mysqld
    restart: always
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - app-network
    environment:
      TZ: "Asia/Nicosia"
      MYSQL_ROOT_PASSWORD: "uXmquBhjBvnpnWAftm"
      MYSQL_DATABASE: "repro"
      MYSQL_USER: "repro_user"
      MYSQL_PASSWORD: "t9YS8vYxhxptmHFd2a"

  nginx-container:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    ports:
      - "8942:8942"
    networks:
      - app-network
    volumes:
      - ./certificates:/etc/nginx/ssl # Maps the certificates to the container
    environment:
      # The hostname the reverse proxy responds to. Configurable via .env;
      # see .env.example for details.
      DOMAIN_NAME: ${DOMAIN_NAME:-wonky.local.web}

networks:
  app-network:
    driver: bridge
